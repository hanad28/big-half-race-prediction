[build-system]
requires = ["setuptools==75.8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "big-half-prediction"
version = "0.1.0"
description = "Baseline half marathon finish time prediction from a small personal training dataset"
requires-python = ">=3.10"
dependencies = [
    "numpy==2.2.1",
    "pandas==2.2.3",
    "matplotlib==3.10.0",
]

[project.optional-dependencies]
dev = ["pytest==8.3.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
